name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fase 2/Desarrollo App/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          
          cache: pip
          cache-dependency-path: Fase 2/Desarrollo App/backend/requirements*.txt
      - run: pip install -r "Fase 2/Desarrollo App/backend/requirements-dev.txt"
      - run: python -m pytest

  frontend:
    name: Frontend (tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fase 2/Desarrollo App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fase 2/Desarrollo App/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest